name: ci_cmake

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1

on:
  push:
    paths:
      - "**.f90"
      - "**.F90"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci_cmake.yml"


jobs:

  linux_macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    name: ${{ matrix.os }} Ncurses-${{ matrix.ncurses }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ncurses: [true, false]

    steps:

# Ncurses already installed on macOS and Linux runners
    # - name: Install packages Linux
    #   if: runner.os == 'Linux'
    #   run: sudo apt install --no-install-recommends libncurses-dev

    - name: install X11 Linux
      if: runner.os == 'Linux'
      run: sudo apt install --no-install-recommends libxmu-dev libxpm-dev libxt-dev libxaw7-dev libx11-dev

    # - name: Install packages MacOS
    #   if: runner.os == 'macOS'
    #   run: brew install ncurses

    - name: Install X11 macOS
      if: runner.os == 'macOS'
      run: brew install libxt libxaw libx11

    - name: macOS FC
      if: runner.os == 'macOS'
      run: echo "FC=gfortran-15" >> $GITHUB_ENV

    - &checkout
      uses: actions/checkout@v6

    - run: cmake -Bbuild -Dfind:BOOL=${{ matrix.ncurses }} --preset default

    - run: cmake --workflow default


  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc-fortran

    - name: Put MSYS2_MinGW64 on PATH
      run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - *checkout

    - run: cmake --workflow default
